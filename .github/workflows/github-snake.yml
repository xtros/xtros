name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate monochrome neon snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: xtros
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-dark.svg?color_snake=%23ffffff&color_dots=%23111111,%232b2b2b,%23555555,%23a8a8a8,%23ffffff
            dist/github-snake-light.svg?color_snake=%23111111&color_dots=%23f2f2f2,%23d8d8d8,%23a8a8a8,%23555555,%23111111

      - name: Push snake output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
